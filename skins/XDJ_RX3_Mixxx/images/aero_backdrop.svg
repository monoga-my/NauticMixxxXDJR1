<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <!-- Dark Frutiger Aero backdrop: pure black centre, soft pink and icy cyan
       glows and translucent bubbles only around the outer edge. Stretched
       behind the whole skin; panels and waveforms sit on top of it. -->
  <defs>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6ec7" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ff6ec7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff6ec7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd6ff" stop-opacity="0.40"/>
      <stop offset="0.45" stop-color="#6fd6ff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#6fd6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubbleCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd6ff" stop-opacity="0.02"/>
      <stop offset="0.78" stop-color="#6fd6ff" stop-opacity="0.08"/>
      <stop offset="0.95" stop-color="#bff1ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#bff1ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubblePink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8ac8" stop-opacity="0.02"/>
      <stop offset="0.78" stop-color="#ff8ac8" stop-opacity="0.08"/>
      <stop offset="0.95" stop-color="#ffd0ea" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffd0ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.12" stop-color="#ffe4f4" stop-opacity="0.45"/>
      <stop offset="0.4" stop-color="#ff8ac8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ff8ac8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flareCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.12" stop-color="#dff8ff" stop-opacity="0.4"/>
      <stop offset="0.4" stop-color="#6fd6ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6fd6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="800" fill="#000"/>

  <!-- Perimeter glows, centred outside the canvas so only their fringe shows. -->
  <ellipse cx="-40" cy="-30" rx="420" ry="300" fill="url(#pink)"/>
  <ellipse cx="1320" cy="-30" rx="420" ry="300" fill="url(#cyan)"/>
  <ellipse cx="-40" cy="830" rx="420" ry="300" fill="url(#cyan)"/>
  <ellipse cx="1320" cy="830" rx="420" ry="300" fill="url(#pink)"/>
  <ellipse cx="640" cy="-60" rx="520" ry="110" fill="url(#cyan)" opacity="0.7"/>
  <ellipse cx="640" cy="860" rx="520" ry="110" fill="url(#pink)" opacity="0.7"/>
  <ellipse cx="-60" cy="400" rx="110" ry="360" fill="url(#pink)" opacity="0.7"/>
  <ellipse cx="1340" cy="400" rx="110" ry="360" fill="url(#cyan)" opacity="0.7"/>

  <!-- Bubbles along the edges. -->
  <g>
    <circle cx="22" cy="140" r="16" fill="url(#bubbleCyan)"/>
    <ellipse cx="17" cy="133" rx="6" ry="3.5" fill="url(#shine)"/>
    <circle cx="10" cy="300" r="7" fill="url(#bubblePink)"/>
    <ellipse cx="8" cy="297" rx="2.6" ry="1.6" fill="url(#shine)"/>
    <circle cx="18" cy="610" r="12" fill="url(#bubblePink)"/>
    <ellipse cx="14" cy="605" rx="4.5" ry="2.6" fill="url(#shine)"/>
    <circle cx="1262" cy="190" r="13" fill="url(#bubblePink)"/>
    <ellipse cx="1258" cy="184" rx="5" ry="2.8" fill="url(#shine)"/>
    <circle cx="1270" cy="520" r="8" fill="url(#bubbleCyan)"/>
    <ellipse cx="1268" cy="517" rx="3" ry="1.8" fill="url(#shine)"/>
    <circle cx="1255" cy="700" r="18" fill="url(#bubbleCyan)"/>
    <ellipse cx="1249" cy="692" rx="7" ry="4" fill="url(#shine)"/>
    <circle cx="300" cy="792" r="9" fill="url(#bubbleCyan)"/>
    <ellipse cx="297" cy="788" rx="3.4" ry="2" fill="url(#shine)"/>
    <circle cx="980" cy="794" r="6" fill="url(#bubblePink)"/>
    <ellipse cx="978" cy="792" rx="2.2" ry="1.3" fill="url(#shine)"/>
    <circle cx="760" cy="6" r="5" fill="url(#bubblePink)"/>
    <circle cx="420" cy="5" r="4" fill="url(#bubbleCyan)"/>
  </g>

  <!-- Soft lens flares in two corners. -->
  <circle cx="14" cy="10" r="46" fill="url(#flare)"/>
  <circle cx="1268" cy="790" r="40" fill="url(#flareCyan)"/>
</svg>
